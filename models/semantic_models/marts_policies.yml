semantic_models:
  - name: policies
    description: Policy fact semantic model defined directly on the upstream `hippo_pov` policy fact and scoped to policy analytics only.
    model: ref('hippo_pov', 'fct_policies')
    defaults:
      agg_time_dimension: effective_date
    entities:
      - name: policy
        type: primary
        expr: policy_id
      - name: customer
        type: foreign
        expr: customer_id
      - name: property
        type: foreign
        expr: property_id
      - name: agent
        type: foreign
        expr: agent_id
      - name: quote
        type: foreign
        expr: quote_id
    dimensions:
      - name: effective_date
        type: time
        type_params:
          time_granularity: day
      - name: expiration_date
        type: time
        type_params:
          time_granularity: day
      - name: cancellation_date
        type: time
        type_params:
          time_granularity: day
      - name: state
        type: categorical
      - name: coverage_type
        type: categorical
      - name: policy_status
        type: categorical
      - name: is_new_business
        type: categorical
      - name: is_active
        type: categorical
      - name: acquisition_channel
        type: categorical
      - name: property_type
        type: categorical
      - name: construction_type
        type: categorical
      - name: has_smart_home_device
        type: categorical
      - name: agent_channel
        type: categorical
      - name: agent_region
        type: categorical
    measures:
      - name: policy_count
        description: Count of policies.
        agg: count_distinct
        expr: policy_id
      - name: active_policy_count
        description: Count of active policies.
        agg: count_distinct
        expr: case when is_active then policy_id end
      - name: new_business_policy_count
        description: Count of new business policies.
        agg: count_distinct
        expr: case when is_new_business then policy_id end
      - name: written_premium
        description: Total written premium across policies.
        agg: sum
        expr: premium_amount

  - name: customers
    description: Customer dimension semantic model defined directly on the upstream `hippo_pov` customer dimension.
    model: ref('hippo_pov', 'dim_customers')
    entities:
      - name: customer
        type: primary
        expr: customer_id
    dimensions: []

  - name: properties
    description: Property dimension semantic model defined directly on the upstream `hippo_pov` property dimension.
    model: ref('hippo_pov', 'dim_properties')
    entities:
      - name: property
        type: primary
        expr: property_id
      - name: customer
        type: foreign
        expr: customer_id
    dimensions:
      - name: city
        type: categorical
      - name: state
        type: categorical
      - name: zip_code
        type: categorical
      - name: property_type
        type: categorical
      - name: construction_type
        type: categorical
      - name: year_built
        type: categorical
      - name: square_footage
        type: categorical
      - name: roof_age_years
        type: categorical
      - name: has_smart_home_device
        type: categorical

  - name: agents
    description: Agent dimension semantic model defined directly on the upstream `hippo_pov` agent dimension.
    model: ref('hippo_pov', 'dim_agents')
    entities:
      - name: agent
        type: primary
        expr: agent_id
    dimensions:
      - name: agent_channel
        type: categorical
      - name: agent_region
        type: categorical
        expr: region
      - name: agent_is_active
        type: categorical
        expr: is_active
      - name: hire_date
        type: time
        type_params:
          time_granularity: day

metrics:
  - name: policy_count
    description: Count of policies.
    label: Policy Count
    type: simple
    type_params:
      measure: policy_count

  - name: active_policy_count
    description: Count of active policies.
    label: Active Policy Count
    type: simple
    type_params:
      measure: active_policy_count

  - name: new_business_policy_count
    description: Count of new business policies.
    label: New Business Policy Count
    type: simple
    type_params:
      measure: new_business_policy_count

  - name: written_premium
    description: Total written premium across policies.
    label: Written Premium
    type: simple
    type_params:
      measure: written_premium
